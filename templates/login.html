{% extends "base.html" %}
{% from "_ui.html" import flashes, csrf %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="auth-brand"><span class="brand-mark">CD</span><span>CloudDesk</span></div>
  <h1>Sign in</h1>
  <p class="muted">Use the email and password you registered with.</p>
  {{ flashes() }}
  <form method="post">
    {{ csrf() }}
    <input type="hidden" name="next" value="{{ next }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn btn-primary btn-block" type="submit">Sign in</button>
  </form>
  <p class="auth-alt">New to CloudDesk? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
