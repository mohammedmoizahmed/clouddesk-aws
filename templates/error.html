{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="{{ 'error-page' if g.user else 'auth-card' }}">
  <div class="error-code">{{ code }}</div>
  <h1>{{ title }}</h1>
  <p class="muted">{{ message }}</p>
  <p><a class="btn btn-primary" href="{{ url_for('home') if g.user else url_for('login') }}">{{ 'Back to home' if g.user else 'Go to sign in' }}</a></p>
</div>
{% endblock %}
